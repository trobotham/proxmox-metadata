name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.22.x"
          - "stable"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Show Go version
        run: go version

      - name: Run unit tests with race detector
        run: go test -race -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Create build directory
        run: mkdir -p build

      - name: Build metadata server
        run: go build -trimpath -o build/proxmox-metadata .

      - name: Build synchronizer
        run: go build -trimpath -o build/proxmox-metadata-sync ./cmd/proxmox-metadata-sync

      - name: Upload binaries
        if: matrix.go-version == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: proxmox-metadata-linux-amd64
          path: build/
          if-no-files-found: error
          retention-days: 7

